# ============ 羽毛球生物力学规则引擎（打分/纠错全部基于姿态数学偏差）============
# 坐标系：图像归一化坐标，x向右，y向下（y越小越高）
# 所有阈值均作用于【相对量】（相对躯干长度、相对肩线高度），与拍摄距离无关
rules:
  conf_gate: 0.35            # 关键点平均置信度低于此值 → 判定"无法评估"，不输出分数（防误判）
  fps: 30

  # ---- 通用几何量 ----
  torso_ref: 1.0             # 躯干长度（肩中-髋中）为1，其余距离为相对量

  # 击球点高度：持拍手腕y - 肩线y（负=高于肩；单位:躯干长）
  # 各动作对击球点高度的要求区间 [min, max]
  contact_height:
    高远球: {min: -1.15, max: -0.25, ideal: -0.7}    # 头前上方
    扣杀:   {min: -1.30, max: -0.45, ideal: -0.85}   # 全场最高点
    平抽:   {min: -0.45, max:  0.35, ideal: -0.05}   # 肩-腰之间
    挑球:   {min:  0.15, max:  1.10, ideal:  0.60}   # 低位（膝-小腿）
    发球:   {min: -0.10, max:  0.60, ideal:  0.25}   # 腰下（规则9.1.2）
  contact_height_tol: 0.18    # 超出区间按偏差比例扣分

  # E02 击球点偏后：手腕x落后于持拍侧肩x超过阈值（面向侧面拍摄时）
  behind_x_th: 0.25

  # E03 肘部未抬起：击球前0.15s内 肘关节y 高于(小于)肩y 的裕度
  elbow_raise_th: -0.15       # 肘y-肩y 需小于该值(更高)

  # E04 挥拍幅度：肩-肘-腕角在挥拍期峰值
  swing_arm_angle:
    min_ok: 140               # >=140° 视为充分打开
  # E05 手腕闪动：击球前0.1s 腕角(肘-腕-掌指代理用肘腕连线角速度)变化率
  wrist_flick_th: 2.2         # rad/s 等效阈值（以肘-腕连线角速度峰值计）

  # E06 转体：双肩连线与双髋连线夹角峰值（图像平面近似）
  twist_th: 18                # 度

  # E07 重心起伏：击球窗口内 髋心y 波动幅度
  hip_bob_th: 0.22

  # E08 膝超脚尖：弓步时 前膝x 超过 同侧踝x 的量（取相对躯干）
  knee_over_toe_th: 0.28
  # E09 弓步深度：前膝角（髋-膝-踝）最小值
  lunge_angle_min: 105        # 度，大于该值视为蹲得不够

  # E10 发球过腰：仅发球类检查 击球时腕y - 腰线y（>0为低于腰线才合法；此处检测过腰=击球点高于腰）
  serve_over_waist_th: -0.05  # 腕y-腰线y 小于该值 → 击球点高于腰线 → 违例风险

  # E12 回中：动作结束后髋心x/y 与起始站位偏差
  recovery_th: 0.45
  # E13 站姿：双踝横向间距
  stance_width: {min: 0.55, max: 1.60}
  # E14 非持拍手：非持拍腕y-肩y
  offhand_raise_th: 0.05      # 需小于该值（抬至肩部以上附近）

  # E15 腾空：击球时刻双踝y均值 - 窗口内最低值
  airborne_drop_th: 0.18      # 高于该值视为明显腾空（非起跳杀球时提示时机不当）

  # 打分
  score:
    start: 100
    penalty: {轻: 4, 中: 8, 重: 12}
    kp_conf_weight: 0.35      # 关键点置信度对单关节分的权重

  # 错误严重度分档（偏差/阈值 比值）
  severity_ratio: {轻: 1.0, 中: 1.6, 重: 2.4}
