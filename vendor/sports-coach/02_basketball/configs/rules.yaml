# ============ 篮球生物力学规则引擎（打分/纠错全部基于姿态数学偏差）============
# 坐标系：图像归一化坐标，x向右，y向下。所有阈值作用于相对量（/躯干长 或 角度）。
rules:
  conf_gate: 0.35
  fps: 30

  # ---- E01 出手点：出手帧 腕y-肩线y（/躯干），需 <= min（负=高于肩）----
  release_height_min: -0.80          # 至少高于肩0.8躯干（约过头）
  # ---- E02 压腕跟随：出手后0.15s 肘-腕连线角速度峰值（度/秒）----
  wrist_follow_deg_s: 90
  # ---- E03 肘外展：出手前0.2s 肘偏离肩-腕连线的水平距离（/躯干）----
  elbow_flare_th: 0.30
  # ---- E04 出手弧度：腕速度仰角 atan2(-vy,|vx|)（度）----
  release_arc_deg_min: 38
  # ---- E05 垂直度：起跳窗口 肩中x漂移（/躯干）----
  lean_th: 0.28
  # ---- E06 腾空：踝中离地高度（/躯干）----
  airborne_min: 0.10
  # ---- E07 屈膝：窗口内最小膝角（度）大于该值 → 未蹲下去（按类别）----
  knee_bend_th: {投篮: 120, 三步上篮: 125, 传球: 150, 防守姿势: 150, 运球: 150}
  # ---- E08 双踝离地不同步（/躯干）----
  ankle_asym_th: 0.15
  # ---- E09 运球腕弹性：触球段 肘-腕角速度峰值（度/秒）低于该值 → 僵硬 ----
  dribble_wrist_flick_deg_s: 150
  # ---- E10 运球高度：触球帧 腕y-髋线y（/躯干）小于该值 → 过高 ----
  dribble_high_th: -0.15
  # ---- E11 低头：鼻y-肩线y（/躯干）大于该值 → 含胸低头 ----
  head_down_th: -0.05
  # ---- E12 上篮抬膝：出手帧 前膝角（髋-膝-踝）大于该值 → 膝未抬起 ----
  knee_lift_deg_max: 105
  # ---- E13 重心：窗口内 (髋中y-踝中y)/躯干 均值 大于该值 → 站太直 ----
  def_hip_height_max: 1.05
  # ---- E14 站姿：双踝横间距（/躯干）----
  stance_width: {min: 0.85, max: 2.20}
  # ---- E15 重心横移：窗口内 |肩中x-髋中x|（/躯干）峰值 ----
  sway_th: 0.22

  score:
    start: 100
    penalty: {轻: 4, 中: 8, 重: 12}
    kp_conf_weight: 0.35
  severity_ratio: {轻: 1.0, 中: 1.6, 重: 2.4}
