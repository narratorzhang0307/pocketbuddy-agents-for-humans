# 排球规则阈值（打分/纠错全部基于姿态数学偏差）
rules:
  conf_gate: 0.35
  fps: 30
  dig_elbow_min_deg: 150
  dig_wrist_rel_hip: {min: -0.45, max: 0.50}
  side_offset_th: 0.45
  toss_height_th: -0.35
  serve_low_th: 0.30
  airborne_min: 0.12
  spike_contact_th: -0.60
  whip_speed_min: 250
  block_overhead_th: 0.02
  knee_bend_th: {垫球: 150, 发球: 150, 扣球: 120, 拦网: 125}
  lean_range: {min: 0.06, max: 0.45}
  stance_width: {min: 0.55, max: 1.80}
  hip_bob_th: 0.20
  hands_gap_th: 0.30
  score:
    start: 100
    penalty: {轻: 4, 中: 8, 重: 12}
    kp_conf_weight: 0.35
  severity_ratio: {轻: 1.0, 中: 1.6, 重: 2.4}
