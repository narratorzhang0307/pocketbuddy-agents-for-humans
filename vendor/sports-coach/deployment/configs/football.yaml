# 足球规则阈值（打分/纠错全部基于姿态数学偏差）
rules:
  conf_gate: 0.35
  fps: 30
  kick_speed_min: {传球: 1.2, 射门: 2.0}
  swing_amp_min_deg: {传球: 40, 射门: 55}
  support_offset: {min: 0.05, max: 0.90}
  support_knee_th_deg: 150
  lean_th: 0.28
  support_lift_th: 0.12
  hip_height_max: 1.10
  shoulder_tilt_deg: 15
  soft_touch_max: 3.0
  juggle_thigh_deg: 45
  rhythm_jitter: 0.45
  rhythm_tol: 0.15
  follow_ratio: 0.35
  head_down_th: -0.05
  stance_width: {min: 0.50, max: 2.00}
  arms_th: 0.50
  score:
    start: 100
    penalty: {轻: 4, 中: 8, 重: 12}
    kp_conf_weight: 0.35
  severity_ratio: {轻: 1.0, 中: 1.6, 重: 2.4}
