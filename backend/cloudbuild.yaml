substitutions:
  _REGION: asia-east1
  _SERVICE: pocketbuddy-api
  _REPOSITORY: pocketbuddy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}
      - ./backend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=pocketbuddy-api@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production,GEMMA_MODEL=gemma-3-4b-pocketbuddy
      - --update-secrets=GEMMA_API_TOKEN=GEMMA_API_TOKEN:latest,GEMMA_BASE_URL=GEMMA_BASE_URL:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}
