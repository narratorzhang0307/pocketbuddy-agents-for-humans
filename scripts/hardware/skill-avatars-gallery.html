<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost · 17 个口袋伙伴</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#213e3a;font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:44px 32px}header{border-bottom:1px solid #c8d1c7;padding-bottom:24px;margin-bottom:28px}.eyebrow{font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.2em;color:#60716a}h1{font-size:42px;line-height:1.15;letter-spacing:-.05em;margin:12px 0}header p{color:#65766d;margin:12px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 16px}.tile{border:0;padding:0;background:none;text-align:left;color:inherit;cursor:pointer;min-width:0}.tile img{display:block;width:100%;aspect-ratio:1;border-radius:20px;border:3px solid transparent;transition:transform .15s}.tile:hover img{transform:translateY(-3px)}.tile[aria-pressed=true] img{border-color:#244c40}.tile b{font-size:12px;display:block;margin:6px 4px 0}.tile small{font:10px/1.5 ui-monospace,monospace;color:#718176;display:block;margin:3px 4px;overflow-wrap:anywhere}.tile:focus-visible{outline:3px solid #237756;outline-offset:5px;border-radius:20px}aside{position:sticky;top:24px;align-self:start;text-align:center;background:#e6ebe0;border-radius:28px;padding:24px 18px}.device{display:block;cursor:pointer;border:0;padding:0;position:relative;width:240px;height:240px;background:#101b2b;border-radius:50%;margin:18px auto;color:#d9f0ff;overflow:hidden;box-shadow:0 0 0 6px #273630,0 9px 24px #142b2426;font:12px/1.2 ui-monospace,monospace}.device img{position:absolute;width:240px;height:240px;left:0;top:0}.device .name,.device .status{position:absolute;z-index:1;background:#172c36b3;color:white;border-radius:24px;padding:3px 6px;font:14px/16px Arial,sans-serif;white-space:nowrap}.device .name{top:18px;left:50%;transform:translateX(-50%);max-width:180px}.device .status{top:198px;width:70px;height:22px;text-align:center}.device .battery{left:49px}.device .connection{left:121px}.device:not(.show-status) .name,.device:not(.show-status) .status{display:none}aside h2{font-size:16px;margin:8px 0}.note{font-size:11px;color:#69796d;margin:12px 0}.sizes{display:flex;gap:18px;align-items:end;justify-content:center;margin:20px 0}.sizes img{display:block;border-radius:8px;margin-bottom:6px}.sizes span{font:10px ui-monospace,monospace;color:#64786a}#rationale{font-size:12px;min-height:54px}a{color:inherit;text-underline-offset:3px}footer{margin-top:38px;border-top:1px solid #c8d1c7;padding-top:18px;font-size:11px;color:#758378}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){main{padding:24px 18px}h1{font-size:34px}.layout{display:flex;flex-direction:column-reverse;gap:24px}aside{position:static;width:100%;padding:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}.tile img{border-radius:15px}.sizes{display:none}.note{margin-bottom:0}.device{margin:16px auto}#rationale{min-height:0}}
</style>
<main>
<header><div class="eyebrow">FROST · SKILL PORTRAITS / 02</div><h1>每一种本领，都有一张脸。</h1><p>焦糖内置，16 位能力伙伴从阿里云 OSS 加载 · 点击头像查看满幅圆屏。</p></header>
<div class="layout"><section class="grid" id="grid" aria-label="17 张头像"></section>
<aside><div class="eyebrow">ROUND DISPLAY · PREVIEW</div><button type="button" class="device" aria-label="240 像素硬件屏幕模拟，轻触查看状态"><div class="name" id="device-name"></div><img id="device-image" alt="当前头像"><div class="status battery">100%</div><div class="status connection">OFFLINE</div></button><h2 id="selected-name"></h2><p id="rationale"></p><div class="sizes"><span><img id="tiny" width="32" height="32" alt="32 像素缩略图">32 px</span><span><img id="small" width="64" height="64" alt="64 像素缩略图">64 px</span></div><a id="original" target="_blank" rel="noopener">查看完整原图 ↗</a><p class="note">240×240 满幅布局模拟，非实机截图。<br>轻触圆屏查看状态，3.5 秒后自动收起。<br>电量为示例值；预览不连接设备。<br>按住 BOOT 时仍显示独立录音提示。</p></aside></div>
<footer>17 张独立生图 · 原图完整保留 · 256 px WebP / 240 px JPEG 圆屏版 / 保留 128 px 旧版 · 谷歌大赛项目</footer>
</main>
<script>
const entries = __CATALOG__;
const grid=document.getElementById('grid');
const webSource=item=>item.cloud?.webUrl||item.web;
const screenSource=item=>item.cloud?.jpegUrl||item.hardware;
let statusTimer;
function showStatus(){const device=document.querySelector('.device');device.classList.add('show-status');clearTimeout(statusTimer);statusTimer=setTimeout(()=>device.classList.remove('show-status'),3500);}
document.querySelector('.device').addEventListener('click',showStatus);
for(const item of entries){const button=document.createElement('button');button.className='tile';button.type='button';button.dataset.id=item.id;button.setAttribute('aria-pressed','false');const image=document.createElement('img');image.src=webSource(item);image.alt=item.name+'头像';image.width=256;image.height=256;const name=document.createElement('b');name.textContent=item.name;const id=document.createElement('small');id.textContent=item.id;button.append(image,name,id);button.addEventListener('click',()=>select(item));grid.append(button);}
function select(item){showStatus();for(const tile of grid.children)tile.setAttribute('aria-pressed',String(tile.dataset.id===item.id));document.getElementById('device-image').src=screenSource(item);document.getElementById('device-image').alt=item.name+'圆屏头像';document.getElementById('device-name').textContent=item.hardwareLabel;document.getElementById('selected-name').textContent=item.name;document.getElementById('rationale').textContent=item.rationale;document.getElementById('tiny').src=webSource(item);document.getElementById('small').src=webSource(item);document.getElementById('original').href=item.original;}
select(entries[0]);
</script>
</html>
