const grid=document.getElementById('grid');
const webSource=item=>item.cloud?.webUrl||item.web;
const screenSource=item=>item.cloud?.jpegUrl||item.hardware;
let statusTimer;
function showStatus(){const device=document.querySelector('.device');device.classList.add('show-status');clearTimeout(statusTimer);statusTimer=setTimeout(()=>device.classList.remove('show-status'),3500);}
document.querySelector('.device').addEventListener('click',showStatus);
for(const item of entries){const button=document.createElement('button');button.className='tile';button.type='button';button.dataset.id=item.id;button.setAttribute('aria-pressed','false');const image=document.createElement('img');image.src=webSource(item);image.alt=item.name+'头像';image.width=256;image.height=256;const name=document.createElement('b');name.textContent=item.name;const id=document.createElement('small');id.textContent=item.id;button.append(image,name,id);button.addEventListener('click',()=>select(item));grid.append(button);}
function select(item){showStatus();for(const tile of grid.children)tile.setAttribute('aria-pressed',String(tile.dataset.id===item.id));document.getElementById('device-image').src=screenSource(item);document.getElementById('device-image').alt=item.name+'圆屏头像';document.getElementById('device-name').textContent=item.hardwareLabel;document.getElementById('selected-name').textContent=item.name;document.getElementById('rationale').textContent=item.rationale;document.getElementById('tiny').src=webSource(item);document.getElementById('small').src=webSource(item);document.getElementById('original').href=item.original;}
select(entries[0]);
