# Dedicated Pocket Buddy bootstrap. Certbot webroot never edits other sites.
server {
    listen 80;
    server_name pocketbuddy.throughtheglass.art;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/pocketbuddy-acme;
    }
    location / {
        return 503 "Pocket Buddy deployment in progress\n";
    }
}
