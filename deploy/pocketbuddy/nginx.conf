limit_req_zone $binary_remote_addr zone=pocketbuddy_coach_start:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pocketbuddy_coach_frames:1m rate=3r/s;

server {
    listen 80;
    server_name pocketbuddy.throughtheglass.art;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/pocketbuddy-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name pocketbuddy.throughtheglass.art;
    ssl_certificate /etc/letsencrypt/live/pocketbuddy.throughtheglass.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocketbuddy.throughtheglass.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\. { return 404; }

    location = /lianlema/api/session/start {
        limit_req zone=pocketbuddy_coach_start burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 768k;
        client_body_buffer_size 768k;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4020/api/session/start;
        proxy_set_header Host $host;
        access_log off;
    }

    location ^~ /lianlema/api/ {
        limit_req zone=pocketbuddy_coach_frames burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 768k;
        client_body_buffer_size 768k;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:4020/api/;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }
}
