limit_req_zone $binary_remote_addr zone=pocket_buddy_demo_coach_start:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pocket_buddy_demo_coach_frames:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=pocket_buddy_demo_maps:1m rate=20r/s;
map $http_origin $pocket_buddy_demo_coach_origin_allowed {
    default 0;
    "" 1;
    "https://pocket-buddy.throughtheglass.art" 1;
}

server {
    listen 80;
    server_name pocket-buddy.throughtheglass.art;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/pocket-buddy-demo-acme;
    }
    location / { return 301 https://pocket-buddy.throughtheglass.art$request_uri; }
}

server {
    listen 443 ssl;
    server_name pocket-buddy.throughtheglass.art;
    ssl_certificate /etc/letsencrypt/live/pocket-buddy.throughtheglass.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocket-buddy.throughtheglass.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;

    # Generated privately on deployment; contains the AMap security code.
    include /root/pocket-buddy-demo/shared/amap-proxy.conf;
    location ~ /\. { return 404; }

    location = /lianlema/api/session/start {
        if ($pocket_buddy_demo_coach_origin_allowed = 0) { return 403; }
        limit_req zone=pocket_buddy_demo_coach_start burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 768k;
        client_body_buffer_size 768k;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4020/api/session/start;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Browser origin is checked above; this hop is a private server request.
        proxy_set_header Origin "";
    }
    location ^~ /lianlema/api/ {
        if ($pocket_buddy_demo_coach_origin_allowed = 0) { return 403; }
        limit_req zone=pocket_buddy_demo_coach_frames burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 768k;
        client_body_buffer_size 768k;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:4020/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin "";
    }
    location ^~ /api/photos-harness/ {
        client_max_body_size 1600k;
        client_body_buffer_size 1600k;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3045;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
    }
    location / {
        proxy_pass http://127.0.0.1:3045;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }
}
