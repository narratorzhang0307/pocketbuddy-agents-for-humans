# Include INSIDE pocketbuddy.throughtheglass.art's existing HTTPS server only.
# Keeps uploaded images out of nginx temporary request-body files and access logs.
location ^~ /api/photos-harness/ {
    client_max_body_size 1600k;
    client_body_buffer_size 1600k;
    client_body_timeout 15s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 240s;
    access_log off;
}
