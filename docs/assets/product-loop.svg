<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Pocket Buddy 产品闭环</title>
  <desc id="desc">Agent Taskmaster 从目标与身体状态出发，经 Frost Harness 评估风险，调用 Skill 或调度专业 Agent，再通过工具、模型与设备取得证据，最终复盘并进入下一轮目标。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#30443d"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #28342f; stroke-width: 2; rx: 14; }
      .accent { fill: #e8fff5; stroke: #16835d; }
      .agent { fill: #f4efff; stroke: #7459a8; }
      .decision { fill: #fff9df; stroke: #9a7b19; stroke-width: 2; }
      .line { fill: none; stroke: #30443d; stroke-width: 2.4; marker-end: url(#arrow); }
      .label { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 650; fill: #16201c; text-anchor: middle; }
      .sub { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #53615c; text-anchor: middle; }
      .edge { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #53615c; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="460" fill="#ffffff"/>

  <rect class="node" x="35" y="175" width="210" height="88"/>
  <text class="label" x="140" y="213">目标与身体状态</text>
  <text class="sub" x="140" y="242">Goal + Context</text>

  <rect class="node accent" x="300" y="175" width="220" height="88"/>
  <text class="label" x="410" y="213">Agent Taskmaster</text>
  <text class="sub" x="410" y="242">Frost Harness · 目标与角色</text>

  <polygon class="decision" points="670,145 780,219 670,293 560,219"/>
  <text class="label" x="670" y="212">风险与复杂度</text>
  <text class="sub" x="670" y="240">Policy Gate</text>

  <rect class="node accent" x="845" y="62" width="210" height="78"/>
  <text class="label" x="950" y="97">直接调用 Skill</text>
  <text class="sub" x="950" y="122">低风险 · 单能力</text>

  <rect class="node agent" x="845" y="298" width="210" height="78"/>
  <text class="label" x="950" y="333">委派专业 Agent</text>
  <text class="sub" x="950" y="358">复杂 · 模糊 · 高风险</text>

  <rect class="node" x="1120" y="175" width="210" height="88"/>
  <text class="label" x="1225" y="213">工具 / 模型 / 设备</text>
  <text class="sub" x="1225" y="242">受控执行</text>

  <rect class="node accent" x="1380" y="175" width="185" height="88"/>
  <text class="label" x="1472" y="213">结果与证据</text>
  <text class="sub" x="1472" y="242">Result + Evidence</text>

  <rect class="node" x="660" y="386" width="280" height="56"/>
  <text class="label" x="800" y="421">复盘 · 记忆 · 下一轮 Goal</text>

  <path class="line" d="M245 219 H300"/>
  <path class="line" d="M520 219 H560"/>
  <path class="line" d="M740 171 C780 118 800 101 845 101"/>
  <path class="line" d="M740 267 C780 319 800 337 845 337"/>
  <path class="line" d="M1055 101 C1090 101 1080 188 1120 205"/>
  <path class="line" d="M1055 337 C1090 337 1080 250 1120 233"/>
  <path class="line" d="M1330 219 H1380"/>
  <path class="line" d="M1472 263 V340 C1472 375 1435 414 1360 414 H940"/>
  <path class="line" d="M660 414 H180 C70 414 45 350 80 263"/>

  <text class="edge" x="800" y="94">低风险</text>
  <text class="edge" x="794" y="340">需专业复核</text>
</svg>
